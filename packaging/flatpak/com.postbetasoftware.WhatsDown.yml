app-id: com.postbetasoftware.WhatsDown
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: whatsdown

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.OpenURI

build-options:
  append-path: /usr/lib/sdk/golang/bin
  build-args:
    - --share=network
  env:
    GOPATH: /run/build/whatsdown/go
    GOFLAGS: -trimpath -modcacherw

modules:
  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - /share/gir-1.0
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.20.4

  - name: whatsdown
    buildsystem: simple
    build-commands:
      - blueprint-compiler batch-compile ui ui ui/*.blp ui/components/*.blp
      - go build -mod=vendor -v -ldflags="-s -w" -o /app/bin/whatsdown .
      - install -Dm644 com.postbetasoftware.WhatsDown.desktop /app/share/applications/com.postbetasoftware.WhatsDown.desktop
      - install -Dm644 com.postbetasoftware.WhatsDown.svg /app/share/icons/hicolor/scalable/apps/com.postbetasoftware.WhatsDown.svg
      - install -Dm644 com.postbetasoftware.WhatsDown.metainfo.xml /app/share/metainfo/com.postbetasoftware.WhatsDown.metainfo.xml
    sources:
      - type: git
        url: https://github.com/EmirOven/WhatsDown.git
        branch: main
